<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">
  <title>Elevated Business | A new website is coming soon</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --paper: #f7f7f4;
      --lilac: #f9f1fe;
      --lime: #c0ff15;
      --coral: #ff665c;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(192, 255, 21, .55) 0 7rem, transparent 7.1rem),
        radial-gradient(circle at 88% 82%, rgba(255, 102, 92, .35) 0 9rem, transparent 9.1rem),
        linear-gradient(135deg, var(--lilac), var(--paper));
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(92%, 58rem);
      padding: clamp(2rem, 7vw, 5.5rem);
      border: 2px solid var(--ink);
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, .9);
      box-shadow: 14px 14px 0 var(--ink);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 1.25rem;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 12ch;
      margin: 0 auto 1.25rem;
      font-size: clamp(2.6rem, 8vw, 6.4rem);
      line-height: .92;
      letter-spacing: -.065em;
    }

    p {
      max-width: 38rem;
      margin: 0 auto;
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.65;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      padding: .9rem 1.25rem;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--lime);
      color: var(--ink);
      font-weight: 800;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    a:hover,
    a:focus-visible {
      transform: translate(-3px, -3px);
      box-shadow: 5px 5px 0 var(--ink);
      outline: none;
    }

    @media (max-width: 34rem) {
      main { box-shadow: 8px 8px 0 var(--ink); }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Elevated Business is evolving</p>
    <h1>Something new is coming.</h1>
    <p>A fresh Elevated Business website is on its way, created to help service businesses stay visible, build stronger relationships and turn more interest into action.</p>
    <a href="mailto:rebecca@elevatedbusiness.co.uk">Email Rebecca</a>
  </main>
</body>
</html>
